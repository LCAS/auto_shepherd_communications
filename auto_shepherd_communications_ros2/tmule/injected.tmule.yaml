session: communicator
init_cmd: |
  echo " "
  echo " "
  echo " "
  echo "Running Initialisation"

  #exec /bin/bash
  cd @TMULE_CONFIG_DIR@ || true
  set -o pipefail

  # Source the .bashrc
  source ~/.bashrc

  # Setup ROS2 DDS Settings
  export ROS_DOMAIN_ID=70
  unset ROS_LOCALHOST_ONLY

  # Identify share directory
  pkg="auto_shepherd_communications_ros2"
  export PKG="$(ros2 pkg prefix $pkg)/share/$pkg/config"

  # Simulated device declarations
  export RF_DEVICE='/dev/ttyVserver'
  export LOOPBACK_DEVICE='/dev/ttyVrobot'
  export TOPIC_CONFIG="$PKG/robot.yaml"

windows:

  - name: outputs
    panes:
      - ros2 run auto_shepherd_communications_ros2 serial_node_reciever.py device:=$LOOPBACK_DEVICE

  - name: system
    panes:
      - ros2 run auto_shepherd_communications_ros2 bridge_interface.py
      - ros2 run auto_shepherd_communications_ros2 serial_node.py device:=$RF_DEVICE

  - name: inputs
    panes:
      - ros2 run auto_shepherd_communications_ros2 data_loader_node.py
